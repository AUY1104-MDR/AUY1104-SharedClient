# EFT · Service de preview del color BLUE.
# Permite validar la salud del candidato blue sin tocar el tráfico
# de producción (paso 8 de deploy-api.yaml).
apiVersion: v1
kind: Service
metadata:
  name: techmarket-orders-preview-blue
  labels:
    app: techmarket-orders
    role: preview
spec:
  type: NodePort
  selector:
    app: techmarket-orders
    color: blue
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30091
