
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  usar-receta-compartida:
    # Aquí no repetimos los pasos de Docker: delegamos al otro repositorio
    uses: AUY1104-MDR/AUY1104-SharedWorkflows/.github/workflows/deploy-api.yaml@main

    # Valores que le pasamos a la receta (nombre de la imagen y qué versión es)
    with:
      image-name: demo-api
      # Mismo nombre que el tag que disparó el workflow (ej. v1.2.3)
      image-tag: ${{ github.ref_name }}

    # Datos sensibles: usuario y contraseña/token de Docker Hub
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}