on:
  workflow_dispatch:

jobs:
  ea2-lab:
    uses: AUY1104-MDR/AUY1104-SharedWorkflows/.github/workflows/ea2-provision-k8s-sandbox.yaml@main
    with:
      aws_region: us-east-1
      instance_type: t3.small
      ssh_cidr_ipv4: 0.0.0.0/0
      k8s_api_cidr_ipv4: 0.0.0.0/0
      k8s_stack: k3s
      provision_dockerhub: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EA2_SSH_PRIVATE_KEY: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}